<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCM Remote</title>
<meta name="description" content="Run the DCM lanes from your phone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DCM Remote">
<meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #F7F4EE; --card: #FFFFFF; --ink: #1F1F1F; --muted: #66625B; --line: #E4DED2;
    --accent: #2F5D50; --accent-ink: #FFFFFF; --ok-bg: #D6EAD9; --ok: #1E4D2B;
    --bad-bg: #F6D4D1; --bad: #7A1F17; --wait-bg: #F3E6C8; --wait: #6B4E12; --idle-bg: #ECE7DC;
    --g-done: #2F7D4F; --g-work: #D9932B; --g-todo: #D9D3C6; --g-block: #B5452F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --card: #1F1F1F; --ink: #F2EFE9; --muted: #A8A39A; --line: #34312C;
      --accent: #6FB39C; --accent-ink: #0E1A16; --ok-bg: #1E3A27; --ok: #A8DDB5;
      --bad-bg: #4A1E1A; --bad: #F2B3AC; --wait-bg: #3D3017; --wait: #EED39A; --idle-bg: #2A2824;
      --g-done: #5FB884; --g-work: #E8AC4E; --g-todo: #45413A; --g-block: #E07A62;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 20px; margin: 0; }
  header .pc { font-size: 13px; color: var(--muted); text-align: right; }
  main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 88px); max-width: 640px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button svg { width: 24px; height: 24px; }
  nav button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  nav .badge { background: var(--bad); color: var(--card); border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 2px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .card h3 { font-size: 16px; margin: 0 0 4px; }
  .meta { font-size: 13px; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .chip { display: inline-block; font-size: 13px; padding: 2px 9px; border-radius: 999px; background: var(--idle-bg); color: var(--muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.wait { background: var(--wait-bg); color: var(--wait); }
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lane { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .lane b { display: block; font-size: 15px; }
  .cardtext p { margin: 6px 0 0; font-size: 14px; } .cardtext p span { color: var(--muted); }
  button.primary, button.secondary { font: inherit; font-weight: 600; border-radius: 10px; padding: 11px 14px; border: 0; width: 100%; min-height: 44px; }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.secondary { background: var(--idle-bg); color: var(--ink); }
  button:disabled { opacity: .45; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  textarea, input[type=password], input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  textarea { min-height: 96px; }
  label.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 10px 0; }
  label.check input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  .q { white-space: pre-wrap; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px; margin: 8px 0; max-height: 280px; overflow: auto; }
  a { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
  .warn { background: var(--wait-bg); color: var(--wait); border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-top: 8px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 76px); background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px; z-index: 9; display: none; }
  dialog { border: 0; border-radius: 16px; padding: 18px; width: min(92vw, 480px); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  ol.steps { padding-left: 20px; } ol.steps li { margin: 6px 0; }
  .hide { display: none !important; }
  .gauge { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .gauge.empty { display: block; }
  .gtext { text-align: right; } .gpct { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .card.opened { position:relative; } .card.opened > .meta:first-of-type, .card.opened > h3 { padding-right:44px; }
  .x { position:absolute; top:8px; right:8px; width:36px; height:36px; border:0; border-radius:50%; background:var(--idle-bg); color:var(--ink); font:600 17px/1 inherit; display:flex; align-items:center; justify-content:center; }
  dialog { position:relative; } dialog > .x { top:10px; right:10px; } dialog h3 { padding-right:44px; }
  .seg2 { display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--idle-bg); border-radius:12px; padding:4px; margin-bottom:12px; }
  .seg2 button { border:0; border-radius:9px; padding:9px 6px; font:inherit; font-weight:600; background:transparent; color:var(--muted); }
  .seg2 button[aria-pressed="true"] { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  #review { position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  #review.hide { display:none; }
  .rvtop { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .rvtop .x { position:static; }
  .rvbar { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .big { min-height:52px; font-size:17px; }
  .rvans { margin-top:8px; padding:10px 12px; border-radius:10px; background:var(--wait-bg); color:var(--ink); white-space:pre-wrap; font-size:15px; }
  .lchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .lchip { border:1px solid var(--line); border-radius:999px; padding:7px 13px; font:inherit; font-weight:600; background:var(--card); color:var(--ink); min-width:44px; }
  .lchip[aria-pressed="true"] { background:var(--accent); border-color:transparent; color:var(--accent-ink); }
  .hright { display:flex; align-items:center; gap:10px; }
  .quit { border:0; border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; font-weight:600; background:var(--idle-bg); color:var(--ink); }
  #closed { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  #closed.hide { display:none; }
  .closedbox { max-width:360px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>DCM Remote</h1>
  <div class="hright"><div class="pc" id="pc">…</div><button class="quit" id="quit" type="button" aria-label="Close the app">Close</button></div>
</header>
<div id="review" class="hide" role="dialog" aria-label="Review out loud"></div>
<div id="closed" class="hide"><div class="closedbox"><h3 style="margin-top:0;font-size:20px">DCM Remote is closed</h3>
  <p>It has stopped checking GitHub, so it uses no data or battery.</p>
  <p class="meta">To leave the screen, swipe up from the bottom edge. (iPhone does not let an app close itself.)</p>
  <button class="primary" id="reopen" type="button">Open again</button></div></div>
<main id="main"></main>
<nav id="nav" class="hide">
  <button data-tab="status" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Status</button>
  <button data-tab="decide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span>Decide <span class="badge hide" id="bWait"></span></span></button>
  <button data-tab="merges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8 6c6 0 8 2 8 3.5"/></svg><span>Merges <span class="badge hide" id="bPr"></span></span></button>
  <button data-tab="lanes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4v16M12 4v16M19 4v16"/></svg>Lanes</button>
</nav>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>

<script>
const CFG = {
  owner: 'TheDreamCultureMovement',
  repos: { dcm: 'TheDreamCultureMovement/dream-culture-movement', market: 'TheDreamCultureMovement/dream-culture-market' },
  requestIssue: 714,
  laneNames: { A: 'Scripts (M1; M6 paused)', B: 'Visuals & Video', C: 'Delivery & System', D: 'Revenue (M7)', R: 'Tool Watch', M: 'Market website', X: 'Access (Tab 8.2)' },
};
const KEY = 'dcmRemoteToken';
let token = null;
try { token = localStorage.getItem(KEY); } catch (e) { token = null; }
let tab = 'status';
let decideSub = 'decide';   // Decide tab: 'decide' (questions) or 'read' (finished research to read)
const OLD_DAYS = 7;         // a question with no movement for this long goes in "Old"
const data = { status: null, waiting: [], reading: [], prs: [], inprog: [], attended: [], today: { prs: [], closed: [] }, requests: [], loadedAt: 0, error: '' };
const qcache = {};       // latest comment, choices and recommendation per question
const open = {};          // expanded items
const pending = {};       // request id -> label, until a result arrives

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ago(iso) {
  if (!iso) return 'never';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 48) return h + ' h ago';
  return Math.round(h / 24) + ' days ago';
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 4000); }

async function api(path, opts = {}) {
  const res = await fetch('https://api.github.com/' + path, {
    method: opts.method || 'GET',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store',
  });
  if (res.status === 401) { throw new Error('GitHub refused the key. It may have expired: tap "Change key" on the Lanes tab.'); }
  if (!res.ok && res.status !== 204) { let m = ''; try { m = (await res.json()).message; } catch (e) {} throw new Error('GitHub said ' + res.status + (m ? ': ' + m : '')); }
  return res.status === 204 ? null : res.json();
}

function card(body) {
  const out = {};
  if (!body) return out;
  const i = body.search(/^##\s+In plain words/m);
  if (i < 0) return out;
  for (const line of body.slice(i).split('\n').slice(1)) {
    if (/^\s*#/.test(line)) break;
    const m = line.match(/^\s*[-*]?\s*\**\s*(What it does|Why it matters|Status|Needs you)\s*:\s*\**\s*(.*)$/);
    if (m) out[m[1]] = m[2].trim();
  }
  return out;
}
function laneOf(labels) {
  const l = (labels || []).map((x) => x.name).find((n) => /^lane-[a-z]$/.test(n));
  return l ? l.slice(5).toUpperCase() : null;
}
function cardHtml(c, keys) {
  return '<div class="cardtext">' + keys.filter((k) => c[k]).map((k) => `<p><span>${esc(k)}:</span> ${esc(c[k])}</p>`).join('') + '</div>';
}

// ---------- loading ----------
async function issuesIn(repo, label) {
  const list = await api(`repos/${repo}/issues?state=open&per_page=100${label === '__all__' ? '' : '&labels=' + encodeURIComponent(label)}`);
  return list.filter((i) => !i.pull_request).map((i) => ({ ...i, repoKey: repo === CFG.repos.market ? 'market' : 'dcm' }));
}
async function loadAll() {
  data.error = '';
  try {
    const R = CFG.repos;
    const midnight = new Date(); midnight.setHours(0, 0, 0, 0); const mid = midnight.toISOString();
    const [issue, comments, w1, w2, p1, p2, g1, g2, att, a1, a2, c1, c2] = await Promise.all([
      api(`repos/${R.dcm}/issues/${CFG.requestIssue}`),
      api(`repos/${R.dcm}/issues/${CFG.requestIssue}/comments?per_page=100&since=${new Date(Date.now() - 4 * 864e5).toISOString()}`),
      Promise.all([1, 2, 3].map((pg) => api(`repos/${R.dcm}/issues?state=open&per_page=100&page=${pg}`))).then((ps) => ps.flat().filter((i) => !i.pull_request).map((i) => ({ ...i, repoKey: 'dcm' }))),
      issuesIn(R.market, '__all__'),
      api(`repos/${R.dcm}/pulls?state=open&per_page=100`), api(`repos/${R.market}/pulls?state=open&per_page=100`),
      null, null, null,
      api(`repos/${R.dcm}/pulls?state=all&sort=updated&direction=desc&per_page=60`), api(`repos/${R.market}/pulls?state=all&sort=updated&direction=desc&per_page=40`),
      api(`repos/${R.dcm}/issues?state=closed&since=${mid}&per_page=100`), api(`repos/${R.market}/issues?state=closed&since=${mid}&per_page=100`),
    ]);
    const isToday = (iso) => iso && new Date(iso) >= midnight;
    data.today.prs = [...a1.map((p) => ({ ...p, repoKey: 'dcm' })), ...a2.map((p) => ({ ...p, repoKey: 'market' }))]
      .filter((p) => isToday(p.created_at) || isToday(p.merged_at));
    data.today.closed = [...c1.map((i) => ({ ...i, repoKey: 'dcm' })), ...c2.map((i) => ({ ...i, repoKey: 'market' }))]
      .filter((i) => !i.pull_request && isToday(i.closed_at) && !(i.labels || []).some((l) => ['intel', 'for-reading'].includes(l.name)));
    const m = (issue.body || '').match(/<!-- dcm-remote-json (\{.*?\}) -->/);
    data.status = m ? JSON.parse(m[1]) : null;
    const allOpen = [...w1, ...w2];
    const has = (i, n) => (i.labels || []).some((l) => l.name === n);
    data.open = allOpen;
    data.waiting = allOpen.filter((i) => has(i, 'needs-anthony')).sort((a, b) => a.number - b.number);
    // Finished research and Tool Watch digests (ruling 2026-11-10): read, then "Got it" or decide.
    const pr = (i) => (has(i, 'p1') ? 1 : has(i, 'p2') ? 2 : has(i, 'p3') ? 3 : 4);
    data.reading = allOpen.filter((i) => has(i, 'for-reading') && !has(i, 'needs-anthony'))
      .sort((a, b) => (/Digest/.test(b.title) - /Digest/.test(a.title)) || pr(a) - pr(b) || a.number - b.number);
    data.prs = [...p1.map((p) => ({ ...p, repoKey: 'dcm' })), ...p2.map((p) => ({ ...p, repoKey: 'market' }))];
    data.inprog = allOpen.filter((i) => has(i, 'in-progress'));
    data.attended = allOpen.filter((i) => i.repoKey === 'dcm' && has(i, 'attended-waiting'));
    // requests and their results
    const results = {};
    for (const c of comments) {
      const r = (c.body || '').match(/^dcm-remote-result for (\d+): (\w+)/);
      if (r) (results[r[1]] = results[r[1]] || []).push({ verdict: r[2], text: c.body.split('\n').slice(1).join('\n').trim(), at: c.created_at });
    }
    data.requests = comments.filter((c) => /^dcm-remote:/.test(c.body || '') && c.user.login === CFG.owner)
      .map((c) => { const all = results[String(c.id)] || []; return { id: String(c.id), cmd: c.body.split('\n')[0].replace(/^dcm-remote:\s*/, ''), at: c.created_at, results: all, result: all.length ? all[all.length - 1] : null }; })
      .reverse();
    for (const r of data.requests) if (r.result && pending[r.id] && r.result.verdict !== 'started') delete pending[r.id];   // once queued, the queue card shows it
    data.loadedAt = Date.now();
  } catch (e) { data.error = e.message || String(e); }
  render();
}

// A request with one of these verdicts is still in progress: more results follow.
const OPEN_VERDICTS = ['started', 'queued', 'waiting'];
function verdictCls(v) { return ['done', 'merged'].includes(v) ? 'ok' : OPEN_VERDICTS.includes(v) ? 'wait' : 'bad'; }
async function sendRequest(cmd, label, extra) {
  try {
    const c = await api(`repos/${CFG.repos.dcm}/issues/${CFG.requestIssue}/comments`, { method: 'POST', body: { body: 'dcm-remote: ' + cmd + (extra ? '\n' + extra : '') + '\n\nSent from DCM Remote.' } });
    pending[String(c.id)] = label;
    toast('Sent. The PC picks it up within a minute.');
    if (tab !== 'decide' && tab !== 'merges') tab = 'lanes';
    await loadAll();
  } catch (e) { toast(e.message); }
}

// ---------- screens ----------
function pcLine() {
  const s = data.status;
  if (!s || !s.seen) return { text: 'PC: not reported yet', cls: 'wait' };
  const min = (Date.now() - new Date(s.seen).getTime()) / 60000;
  if (min <= 7) return { text: 'PC online · ' + ago(s.seen), cls: 'ok' };
  return { text: 'PC offline · last seen ' + ago(s.seen), cls: 'bad' };
}
function laneOfPr(p) {
  const m = (p.head && p.head.ref || '').match(/^lane\/([a-z])/);
  if (m) return m[1].toUpperCase();
  if (p.repoKey === 'market' && /^harden/.test(p.head.ref)) return 'M';
  return laneOf(p.labels);
}
// Speedometer: the needle points at the share of today's queue that is done.
function gauge(done, work, block, todo) {
  const tot = done + work + block + todo;
  if (!tot) return '<div class="gauge empty meta">Nothing queued for this lane.</div>';
  const r = 70, cx = 90, cy = 82;
  const xy = (f) => [cx - r * Math.cos(Math.PI * f), cy - r * Math.sin(Math.PI * f)];
  const arc = (f0, f1, col) => { const [x0, y0] = xy(f0), [x1, y1] = xy(Math.max(f0, f1)); return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="var(${col})" stroke-width="14" fill="none"/>`; };
  let f = 0, s = arc(0, 1, '--g-todo');
  for (const [n, col] of [[done, '--g-done'], [work, '--g-work'], [block, '--g-block']]) { if (n) { s += arc(f, f + n / tot - (f + n / tot < 1 ? 0.006 : 0), col); f += n / tot; } }
  const [nx, ny] = xy(done / tot);
  const pct = Math.round((done / tot) * 100);
  const parts = [[work, 'working'], [todo, 'to do'], [block, 'waiting on you']].filter(([n]) => n).map(([n, t]) => `${n} ${t}`).join(' · ');
  return `<div class="gauge"><svg width="150" height="82" viewBox="0 0 180 98" role="img" aria-label="${pct}% of today's queue done"><title>${done} done, ${work} working, ${todo} to do, ${block} waiting on you</title>${s}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)"/></svg>
    <div class="gtext"><div class="gpct">${pct}%</div><div class="meta">of today's queue done</div><div class="meta">${done} of ${tot}${parts ? ' · ' + parts : ''}</div></div></div>`;
}
function viewStatus() {
  const s = data.status; const pc = pcLine();
  let h = `<div class="card"><div class="row"><b>Your PC</b><span class="chip ${pc.cls}">${esc(pc.text)}</span></div>`;
  if (pc.cls !== 'ok') h += '<p class="meta">Requests from the phone wait until the PC is on with the DCM Hub open. Lane status below is from the last report.</p>';

async function loadQuestion(key) {
  if (loadQuestion.busy[key]) return; loadQuestion.busy[key] = true;
  const [rk, n] = key.split('#');
  try {
    const cs = await api(`repos/${CFG.repos[rk]}/issues/${n}/comments?per_page=100`);
    const last = cs.length ? cs[cs.length - 1] : null;
    const issue = [...data.waiting, ...data.reading].find((i) => i.repoKey + '#' + i.number === key);
    const text = last ? last.body : (issue ? issue.body : '');
    qcache[key] = {
      text: last ? `Latest comment (${ago(last.created_at)}):\n\n${last.body.replace(/\*\*/g, '')}` : 'No comments yet. The question is in the card above; open it on GitHub for the full text.',
      choices: parseChoices(text), rec: /recommend/i.test(text || ''), raw: text || '',
    };

}
loadQuestion.wait = async (key) => { if (!qcache[key]) { loadQuestion.busy[key] = false; await loadQuestion(key); } return qcache[key]; };
loadQuestion.busy = {};

// Got it / Drop it / a decision on a research answer. Throws on a GitHub error.
async function issueAction(act, key, text) {

// ---------- review out loud (step 3) ----------
// Walks the Decide (or To read) list one item at a time: reads the card aloud with the
// iPhone's own voice, takes a button or typed/dictated answer, and can ask the PC a question.
const rv = { on: false, mode: 'decide', keys: [], i: 0, asked: {}, spoken: {} };
function rvItems(mode) {
  if (mode === 'read') return data.reading;
  // Same order as the Decide list: questions holding up a lane, other questions, then old ones.
  const rank = (b) => (b.kind === 'old' ? 2 : b.other ? 1 : 0);
  return blockers().filter((b) => b.kind === 'q' || b.kind === 'old').sort((x, y) => rank(x) - rank(y)).map((b) => b.i);
}
function rvList(mode) { return rvItems(mode).map((i) => i.repoKey + '#' + i.number); }
function rvIssue(key) { return [...data.waiting, ...data.reading].find((i) => i.repoKey + '#' + i.number === key); }
function speechText(t) {
  return String(t || '')
    .replace(/<!--[\s\S]*?-->/g, ' ').replace(/```[\s\S]*?```/g, ' ')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/https?:\/\/\S+/g, 'a link')
    .replace(/`([^`]+)`/g, '$1').replace(/[*_#>|]/g, ' ')
    .replace(/(?:[\w.-]+\/)+([\w.-]+\.\w+)(?::\d+(?:-\d+)?)?/g, '$1')
    .replace(/\b(\w+)\.(tsx?|jsx?|ps1|md)\b/g, '$1 file')
    .replace(/→/g, ' to ').replace(/≤/g, ' at most ').replace(/≥/g, ' at least ').replace(/#(\d+)/g, 'number $1')
    .replace(/\s+/g, ' ').trim();
}
let rvVoice = null;
function say(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    if (!rvVoice) { const vs = speechSynthesis.getVoices(); rvVoice = vs.find((v) => /en-US/.test(v.lang) && /Samantha|Ava|Enhanced|Premium/i.test(v.name)) || vs.find((v) => /^en/.test(v.lang)) || null; }
    // iPhone stops long speech partway, so speak in sentence-sized pieces.
    const parts = speechText(text).split(/(?<=[.!?])\s+/).filter((x) => x.trim());
    for (const p of parts) { const u = new SpeechSynthesisUtterance(p.trim()); u.lang = 'en-US'; u.rate = 1; if (rvVoice) u.voice = rvVoice; speechSynthesis.speak(u); }
  } catch (e) {}
}
function recSentence(raw) {
  const lines = String(raw || '').split('\n').map((l) => l.trim()).filter(Boolean);
  const i = lines.findIndex((l) => /recommend/i.test(l));
  if (i < 0) return '';
  let r = lines[i].replace(/^[#*\-\s]*(my\s+)?recommendation:?\**\s*/i, '');
  if (r.length < 25 && lines[i + 1]) r += ' ' + lines[i + 1];

}
function rvSpeech(key) {

  if (q && q.choices.length) t += ' Your options. ' + q.choices.map((ch) => `Option ${ch.id}: ${ch.label}.`).join(' ');
  const rec = q ? recSentence(q.raw) : '';

}
async function rvOpen(mode) {

// The part that changes while you wait: the PC's answer to your question.
function rvLive() {
  const el = document.getElementById('rv-live'); if (!el) return;
  const key = rv.keys[rv.i]; const asks = rv.asked[key] || [];
  el.innerHTML = asks.map((id) => {

async function rvAsk(question) {

  } else if (act && act.startsWith('rv-')) {
    rvAction(act, t);
  } else if (act === 'sub') {
    decideSub = key; render(); window.scrollTo(0, 0);
  } else if (act === 'gotit' || act === 'drop' || act === 'decideread') {
    const [rk, n] = key.split('#'); const repo = CFG.repos[rk];
    let text = '';
    if (act === 'decideread') {
      text = (document.getElementById('ans-' + key).value || '').trim();
      if (!text) return toast('Write your decision first.');
      if (!confirm('Send this decision? Lane R files the work for it next time it runs.')) return;
    } else if (act === 'drop' && !confirm('Drop #' + n + '? It is closed as "not planned". You can reopen it on GitHub.')) return;
    t.disabled = true;
    try { await issueAction(act, key, text); } catch (e) { t.disabled = false; toast(e.message); }
  } else if (act === 'toggle') {
    open[key] = !open[key]; render();
  } else if (act === 'answer') {
    const text = (document.getElementById('ans-' + key).value || '').trim();
    if (!text) return toast('Write an answer first, or tap a quick decision.');
    postAnswer(key, text, document.getElementById('rel-' + key).checked, t);
  } else if (act === 'choose') {
    const q = qcache[key]; const ch = t.dataset.choice;
    const rel = document.getElementById('rel-' + key);
    const extra = (document.getElementById('ans-' + key).value || '').trim();
    let text = ch === 'rec' ? 'Decision: go with the recommendation above.' : `Decision: option ${ch}${q ? ' — ' + ((q.choices.find((c) => c.id === ch) || {}).label || '') : ''}.`;
    if (extra) text += '\n\n' + extra;
    if (!confirm(text.split('\n')[0] + '\n\nSend this decision?')) return;
    postAnswer(key, text, rel ? rel.checked : false, t);
  } else if (act === 'clear') {
    const name = t.dataset.lock;
    if (!confirm('Ask the PC to clear the ' + name + ' lock? It checks first that nothing is running.')) return;
    sendRequest('clear-lock ' + name, 'clear ' + name);
  } else if (act === 'go') {
    const n = key.split('#')[1];
    if (!confirm('Tell Lane X to start #' + n + ' now? It changes sign-in or keys.')) return;
    t.disabled = true;
    try {
      await api(`repos/${CFG.repos.dcm}/issues/${n}/comments`, { method: 'POST', body: { body: 'attended: go\n\n— Anthony (DCM Remote)' } });
      pending['go-' + n] = 'go ' + key; toast('Go sent. Lane X checks every minute.'); await loadAll();
    } catch (e) { t.disabled = false; toast(e.message); }
  } else if (act === 'release') {
    const [rk, n] = key.split('#'); const repo = CFG.repos[rk];
    if (!confirm('Release #' + n + '? The lane will pick it up again the next time it runs.')) return;
    t.disabled = true;
    try {
      await api(`repos/${repo}/issues/${n}/labels/in-progress`, { method: 'DELETE' });
      await api(`repos/${repo}/issues/${n}/comments`, { method: 'POST', body: { body: 'Released from DCM Remote: the lane was not running, so the "being worked on" mark was left behind. The lane can pick this up again.\n\n— Anthony (DCM Remote)' } });
      toast('Released.'); await loadAll();
    } catch (e) { t.disabled = false; toast(e.message); }
  } else if (act === 'merge') {
    const p = data.prs.find((x) => x.repoKey + '#' + x.number === key); if (!p) return;
    const dcm = p.repoKey === 'dcm';
    const d = $('#dlg');
    d.innerHTML = `<h3 style="margin-top:0">Merge ${p.repoKey === 'market' ? 'Market' : 'DCM'} PR #${p.number}?</h3><p>${esc(p.title)}</p>
      <p class="meta">${dcm ? 'Your PC brings it up to date with main, runs the type check, the tests for the files it changes and every guard test, and merges only if all of that passes. The live app and Training then restart.' : 'GitHub runs the Market checks on the up-to-date branch, and your PC merges only if every check passes. The Market site then restarts.'}</p>
      ${isAccessPr(p) ? '<div class="warn">This changes sign-in. Merge only after reading it.</div>' : ''}
      ${dcm ? '<label class="check"><input type="checkbox" id="nopress"> No New AI Ideas press is running right now.</label>' : ''}
      <div class="btns"><button class="secondary" id="dNo">Cancel</button><button class="primary" id="dYes" ${dcm ? 'disabled' : ''}>Yes, merge</button></div>`;
    addX(d); d.showModal();
    if (dcm) $('#nopress').addEventListener('change', (e) => ($('#dYes').disabled = !e.target.checked));
    $('#dNo').onclick = () => d.close();
    $('#dYes').onclick = () => { d.close(); sendRequest(`merge ${key}${dcm ? ' no-press-confirmed' : ''}`, 'merge ' + key); };
  } else if (act === 'mergeall') {
    const rk = key; const dcm = rk === 'dcm';
    const list = readyList(rk);
    const d = $('#dlg');
    d.innerHTML = `<h3 style="margin-top:0">Merge all ready ${dcm ? 'DCM' : 'Market'} PRs?</h3>
      <p class="meta">${list.length} PR${list.length === 1 ? '' : 's'} go into the queue and merge one at a time. Each is checked first; a PR that fails or conflicts is skipped and the rest carry on.</p>
      <div class="q">${list.map((p) => `#${p.number} ${esc(p.title)}`).join('<br>')}</div>
      ${dcm ? '<label class="check"><input type="checkbox" id="nopress"> No New AI Ideas press is running right now.</label><p class="meta">The live app restarts after each DCM merge. If the queue runs past an hour, the PC pauses and asks you again.</p>' : ''}
      <div class="btns"><button class="secondary" id="dNo">Cancel</button><button class="primary" id="dYes" ${dcm ? 'disabled' : ''}>Queue them</button></div>`;
    addX(d); d.showModal();
    if (dcm) $('#nopress').addEventListener('change', (e) => ($('#dYes').disabled = !e.target.checked));
    $('#dNo').onclick = () => d.close();
    $('#dYes').onclick = () => { d.close(); sendRequest(`merge-all ${rk}${dcm ? ' no-press-confirmed' : ''}`, 'merge-all ' + rk); };
  } else if (act === 'qresume') {
    const d = $('#dlg');
    d.innerHTML = `<h3 style="margin-top:0">Resume DCM merges?</h3><p class="meta">Each DCM merge restarts the live app, which cuts off a running press.</p>
      <label class="check"><input type="checkbox" id="nopress"> No New AI Ideas press is running right now.</label>
      <div class="btns"><button class="secondary" id="dNo">Cancel</button><button class="primary" id="dYes" disabled>Resume</button></div>`;
    addX(d); d.showModal();
    $('#nopress').addEventListener('change', (e) => ($('#dYes').disabled = !e.target.checked));
    $('#dNo').onclick = () => d.close();
    $('#dYes').onclick = () => { d.close(); sendRequest('merge-queue resume no-press-confirmed', 'queue resume'); };
  } else if (act === 'qclear') {
    if (!confirm('Take every waiting PR out of the merge queue? Nothing is merged; the one merging now finishes.')) return;
    sendRequest('merge-queue clear', 'queue clear');
  } else if (act === 'start') {
    const lane = t.dataset.lane;
    sendRequest(lane === 'all' ? 'start all' : 'start ' + lane.toLowerCase(), 'start ' + lane);
  }
});

render();
if (token) loadAll();
// "Close": iPhone does not let a home-screen app close itself, so this stops all checking and
// covers the screen; the person swipes up to leave. Opening the app again starts it fresh.
let closedApp = false;
$('#quit').onclick = () => {
  closedApp = true; try { $('#dlg').close(); } catch (e) {}
  $('#closed').classList.remove('hide');
  try { window.close(); } catch (e) {}
};
$('#reopen').onclick = () => { closedApp = false; $('#closed').classList.add('hide'); if (token) loadAll(); };
(function tick() { setTimeout(async () => { if (token && !closedApp && document.visibilityState === 'visible') await loadAll(); tick(); }, Object.keys(pending).length ? 15000 : 45000); })();
document.addEventListener('visibilitychange', () => { if (token && !closedApp && document.visibilityState === 'visible') loadAll(); });
</script>
</body>
</html>
